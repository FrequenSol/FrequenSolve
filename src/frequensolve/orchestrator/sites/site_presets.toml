# Built-in execution-site presets. User site.toml profiles explicitly select a
# preset and may override any value. Queue policy can change without notice;
# Stampede3 values were checked against the TACC user guide updated 2026-06-02.

[presets.stampede3]
type = "slurm"
hostname = "stampede3.tacc.utexas.edu"
mpi_wrapper = "ibrun"
scheduler = "SLURM"
poll_interval = 5
default_partition = "skx-dev"
modules = ["intel/25.1", "impi/21.15", "petsc/3.23", "phdf5"]
documentation_url = "https://docs.tacc.utexas.edu/hpc/stampede3/"
last_verified = "2026-06-02"

[presets.stampede3.partitions.spr]
max_duration = "2-00:00:00"
min_nodes = 1
max_nodes = 32
cores_per_node = 112
sockets_per_node = 2
memory_per_node = 131072
gpus_per_node = 0

[presets.stampede3.partitions.skx]
max_duration = "2-00:00:00"
min_nodes = 1
max_nodes = 256
cores_per_node = 48
sockets_per_node = 2
memory_per_node = 196608
gpus_per_node = 0

[presets.stampede3.partitions.icx]
max_duration = "2-00:00:00"
min_nodes = 1
max_nodes = 32
cores_per_node = 80
sockets_per_node = 2
memory_per_node = 262144
gpus_per_node = 0

[presets.stampede3.partitions.skx-dev]
max_duration = "02:00:00"
min_nodes = 1
max_nodes = 16
cores_per_node = 48
sockets_per_node = 2
memory_per_node = 196608
gpus_per_node = 0

# Intel Data Center GPU Max 1550 nodes, checked with sinfo and the qpvc QoS on
# 2026-10-12. Each node has four GPUs with two stacks each; gpus_per_node counts
# the eight stacks, one MPI rank each, and gpu_memory_per_gpu is one stack's
# device memory in MiB.
[presets.stampede3.partitions.pvc]
max_duration = "2-00:00:00"
min_nodes = 1
max_nodes = 4
cores_per_node = 96
sockets_per_node = 2
memory_per_node = 1031000
gpus_per_node = 8
gpu_memory_per_gpu = 65536

# GPU-aware MPI is the default on PVC: halo exchanges hand device buffers to
# Intel MPI. impi/21.15 hangs with offload in one MPI_Alltoallv pattern, and no
# newer Intel MPI module exists for intel/25.1, so jobs put the ABI-compatible
# 2021.16 runtime ahead of it; drmfd shares GPU IPC handles because the compute
# nodes block pidfd_getfd. The compiler's libraries also go ahead of module
# paths such as python/3.12's, whose older Unified Runtime loader
# (libur_loader) the SYCL runtime cannot use. FS_CUDA_AWARE_MPI = "0" in the
# site environment stages exchanges through host memory instead.
[presets.stampede3.partitions.pvc.environment]
# Let idle OpenMP workers sleep immediately so GPU submission threads can run.
KMP_BLOCKTIME = "0"
ZE_FLAT_DEVICE_HIERARCHY = "FLAT"
SYCL_CACHE_PERSISTENT = "1"
I_MPI_ROOT = "/scratch/projects/compilers/intel25.2/mpi/2021.16"
PATH = "/scratch/projects/compilers/intel25.2/mpi/2021.16/bin:${PATH}"
LD_LIBRARY_PATH = "/scratch/projects/compilers/intel25.2/mpi/2021.16/lib:${CMPLR_ROOT}/lib:${LD_LIBRARY_PATH}"
I_MPI_OFFLOAD = "1"
I_MPI_OFFLOAD_PIN = "0"
I_MPI_OFFLOAD_IPC_MODE = "drmfd"
