codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "64.5...100"
  status:
    project:
      default:
        target: 64.5%
        threshold: 0.1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_head: true
