[project]
name = "frequensolve"
dynamic = [ "version", "classifiers" ]
description = "Python API for FrequenSolve finite element modeling tool"
authors = [{ name = "Jacob Badger", email = "jcbadger@utexas.edu" }]
keywords = ["seismic", "waveform", "geophysics", "modeling"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
   "matplotlib>=3.7,<4.0",
   "numpy>=1.24,<3.0",
   "jinja2>=3.1.5,<4.0",
   "h5py>=3.12.1,<4.0",
   "pylops>=2.4.0,<3.0",
   "scipy>=1.13,<2.0",
   "pint>=0.24.4,<1.0",
   "gitpython>=3.1.44,<4.0",
   "xarray (>=2025.1.1,<2026.0.0)",
   "bitarray (>=3.0.0,<4.0.0)",
   "scikit-learn (>=1.6.1,<2.0.0)",
   "toml (>=0.10.2,<0.11.0)",
   "python-dotenv (>=1.0.1,<2.0.0)",
   "click (>=8.1.8,<9.0.0)",
   "werkzeug (>=3.1.3,<4.0.0)",
   "flask (>=3.1.0,<4.0.0)",
   "boto3 (>=1.36.23,<2.0.0)",
   "requests (>=2.31.0,<3.0.0)",
   "blake3 (>=1.0.5,<2.0.0)",
]

[project.optional-dependencies]
dev = [
   "sphinx",
   "furo",
   "sphinx-rtd-theme",
   "myst-parser",
   "versioneer",
]
parallel = [
   "pyfftw (>=0.14,<0.16)",
   "paramiko (>=3.5.0,<4.0.0)",
   "bokeh (>=3.4.2,<4.0.0)"
]
dask = [
   "dask (>=2025.1.0,<2026.0.0)",
   "dask-jobqueue (>=0.9.0,<0.10.0)",
   "distributed (>=2024.12.0)",
]
seismic = [
   "cython (>=3.0.12,<4.0.0)",
   "segyio (>=1.9.12,<2.0.0)",
   "pyasdf (>=0.8.1,<0.9.0)",
   "multidimio (>=0.8.0,<0.9.0)",
   "zfpy (>=1.0.1,<2.0.0)"
]
em = [
   "emg3d (>=1.8,<2.0)",
   "empymod (>=2.0,<3.0)"
]
all = [
   # Dev optional dependencies
   "sphinx",
   "furo",
   "sphinx-rtd-theme",
   "myst-parser",
   "versioneer",
   # Parallel optional dependencies
   "pyfftw>=0.14,<0.16",
   "paramiko (>=3.5.0,<4.0.0)",
   "dask (>=2025.1.0,<2026.0.0)",
   "dask-jobqueue (>=0.9.0,<0.10.0)",
   # Seismic optional dependencies
   "cython>=3.0.12,<4.0.0",
   "segyio (>=1.9.12,<2.0.0)",
   "pyasdf (>=0.8.1,<0.9.0)",
   "multidimio (>=0.8.0,<0.9.0)",
   "distributed (>=2024.12.0)",
   "bokeh (>=3.4.2,<4.0.0)",
   "zfpy (>=1.0.1,<2.0.0)"
]
#cloud = [
#    "s3fs (>=2024.10.0)",
#    "gcsfs (>=2024.10.0)",
#    "adlfs (>=2024.7.0)"
#]


# TODO: description, etc. included redundantly since some poetry builds don't recognize project
[tool.poetry]
name = "frequensolve"
version = "0.1.0"
description = "Python API for FrequenSolve finite element modeling tool"
authors = ["Jacob Badger <jcbadger@utexas.edu>"]
packages = [{ include = "frequensolve", from = "src" }]
classifiers = ["Development Status :: 4 - Beta"]


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.0.2"
sphinx-copybutton = "^0.5.1"
myst-parser = "^4.0.0"
versioneer = "^0.29"
furo = "^2024.8.6"
pytest = ">=9.0.3,<10.0.0"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.5.0"
pytest-mock = "^3.12.0"
pytest-timeout = "^2.2.0"
pytest-mpl = "^0.16.1"
ipykernel = "^6.29.5"


[tool.poetry.group.parallel]
optional = true

[tool.poetry.group.parallel.dependencies]
pyfftw = ">=0.14,<0.16"
paramiko = ">=3.5.0,<4.0.0"


[tool.poetry.group.dask]
optional = true

[tool.poetry.group.dask.dependencies]
dask = ">=2025.1.0,<2026.0.0"
dask-jobqueue = ">=0.9.0,<0.10.0"
distributed = ">=2024.12.0"


[tool.poetry.group.seismic]
optional = true

[tool.poetry.group.seismic.dependencies]
cython = ">=3.0.12,<4.0.0"
segyio = ">=1.9.12,<2.0.0"
pyasdf = ">=0.8.1,<0.9.0"
multidimio = ">=0.8.0,<0.9.0"

[tool.poetry.group.em]
optional = true

[tool.poetry.group.em.dependencies]
emg3d = ">=1.8,<2.0"
empymod = ">=2.0,<3.0"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/frequensolve/_version.py"
versionfile_build = "src/frequensolve/_version.py"
tag_prefix = ""
parentdir_prefix = "frequensolve-"


[tool.setuptools]
packages = ["frequensolve"]
version = {attr = "frequensolve.__version__"}


[build-system]
requires = ["poetry-core", "setuptools>=45", "wheel", "versioneer[toml]>=0.29"]
build-backend = "poetry.core.masonry.api"



[tool.poetry.group.all]
optional = true


[tool.poetry.group.all.dependencies]
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.0"
versioneer = "^0.29"
furo = "^2024.8.6"
pyfftw = ">=0.14,<0.16"
paramiko = ">=3.5.0,<4.0.0"
dask = ">=2025.1.0,<2026.0.0"
dask-jobqueue = ">=0.9.0,<0.10.0"
cython = ">=3.0.12,<4.0.0"
segyio = ">=1.9.12,<2.0.0"
pyasdf = ">=0.8.1,<0.9.0"
multidimio = ">=0.8.0,<0.9.0"
distributed = ">=2024.12.0"
bokeh = ">=3.4.2,<4.0.0"
zfpy = ">=1.0.1,<2.0.0"
requests = ">=2.31.0,<3.0.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=frequensolve --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 300  # 5 minutes timeout for tests
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
mpl_baseline_path = "tests/reference_images"  # Path to store reference images
markers = [
    "interactive: marks tests that require user input (deselect with '-m \"not interactive\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/frequensolve"]
omit = [
    "tests/*",
    "setup.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
    "@abstractmethod",
]
