[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel",
    "versioneer[toml]>=0.29",
]
build-backend = "setuptools.build_meta"

[project]
name = "frequensolve"
dynamic = ["version"]
description = "Python SDK for authoring and running FrequenSolve finite-element simulations"
authors = [{ name = "FrequenSol", email = "support@frequensol.com" }]
maintainers = [{ name = "FrequenSol", email = "support@frequensol.com" }]
keywords = ["finite-elements", "seismic", "wave-propagation", "modeling"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "blake3>=1.0.5,<2.0.0",
    "bottleneck>=1.3.6,<2.0.0",
    "click>=8.1.8,<9.0.0",
    "h5py>=3.12.1,<4.0.0",
    "jinja2>=3.1.5,<4.0.0",
    "numpy>=1.24,<3.0",
    "pint>=0.24.4,<1.0",
    "scipy>=1.13,<2.0",
    "toml>=0.10.2,<0.11.0",
    "tqdm>=4.66.4,<5.0.0",
    "xarray>=2025.1.1,<2026.0.0",
]

[project.urls]
Homepage = "https://frequensol.com"
Documentation = "https://frequensol.com/docs"
Support = "https://frequensol.com/support"

[project.optional-dependencies]
fast-fft = [
    "pyfftw>=0.14,<0.16",
]
cloud = [
    "boto3>=1.36.23,<2.0.0",
    "flask>=3.1.0,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "werkzeug>=3.1.3,<4.0.0",
]
parallel = [
    "bokeh>=3.4.2,<4.0.0",
    "dask>=2025.1.0,<2026.0.0",
    "dask-jobqueue>=0.9.0,<0.10.0",
    "distributed>=2024.12.0,<2026.0.0",
    "paramiko>=3.5.0,<4.0.0",
    "pyfftw>=0.14,<0.16",
    "python-dotenv>=1.0.1,<2.0.0",
]
hpc = [
    "paramiko>=3.5.0,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]
inversion = [
    "pylops>=2.4.0,<3.0",
]
seismic-io = [
    "bitarray>=3.0.0,<4.0.0",
    "cython>=3.0.12,<4.0.0",
    "pyasdf>=0.8.1,<0.9.0",
    "scikit-learn>=1.6.1,<2.0.0",
    "segyio>=1.9.12,<2.0.0",
    "zfpy>=1.0.1,<2.0.0",
]
visual = [
    "matplotlib>=3.7,<4.0",
    "pyvista>=0.44,<0.47",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0.0,<5.0.0",
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-copybutton>=0.5.1,<0.6.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
]
dev = [
    "black>=25.1.0,<26.0.0",
    "build>=1.2.0,<2.0.0",
    "furo>=2024.8.6",
    "ipykernel>=6.29.5,<7.0.0",
    "isort>=6.0.0,<7.0.0",
    "myst-parser>=4.0.0,<5.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<7.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-mpl>=0.16.1,<0.18.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "ruff>=0.9.0,<1.0.0",
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-copybutton>=0.5.1,<0.6.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
    "twine>=6.0.0,<7.0.0",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["frequensolve*"]

[tool.setuptools.package-data]
"frequensolve.orchestrator" = ["templates/**/*.sh"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/frequensolve/_version.py"
versionfile_build = "frequensolve/_version.py"
tag_prefix = ""
parentdir_prefix = "frequensolve-"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not integration and not cloud and not hpc and not interactive and not visual'"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 300
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
mpl_baseline_path = "tests/reference_images"
markers = [
    "cloud: requires AWS/Cognito/S3 or the FrequenSol cloud control plane",
    "hpc: requires SLURM, SSH, or a configured remote cluster",
    "integration: requires solver binaries or external services",
    "interactive: requires manual input or an already authenticated user session",
    "unit: deterministic unit test with no solver, network, credentials, or scheduler",
    "visual: image comparison or plotting test",
]

[tool.coverage.run]
source = ["src/frequensolve"]
omit = [
    "tests/*",
    "setup.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
    "@abstractmethod",
]

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["F"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"src/frequensolve/util/paraview_wrapper.py" = ["F405"]
