[project]
name = "frequensolve"
dynamic = [ "version", "classifiers" ]
description = "Python API for FrequenSolve finite element modeling tool"
authors = [{ name = "Jacob Badger", email = "jcbadger@utexas.edu" }]
keywords = ["seismic", "waveform", "geophysics", "modeling"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "matplotlib>=3.7,<4.0",
    "numpy>=1.24,<3.0",
    "pyfftw>=0.14,<0.15",
    "jinja2>=3.1.5,<4.0",
    "h5py>=3.12.1,<4.0",
    "pylops>=2.4.0,<3.0",
    "scipy>=1.13,<2.0",
    "pint>=0.24.4,<1.0",
    "gitpython>=3.1.44,<4.0",
    "pydata-sphinx-theme (>=0.16.1,<0.17.0)",
    "furo (>=2024.8.6,<2025.0.0)",
    "xarray (>=2025.1.1,<2026.0.0)",
    "segyio (>=1.9.12,<2.0.0)",
    "pyasdf (>=0.8.1,<0.9.0)"
]


[tool.poetry]
packages = [{ include = "frequensolve", from = "src" }]
version = "0.1.0"
classifiers = ["Development Status :: 4 - Beta"]


[tool.poetry.group.dev.dependencies]
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.0"
ipykernel = "^6.29.5"
versioneer = "^0.29"


[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/frequensolve/_version.py"
versionfile_build = "src/frequensolve/_version.py"
tag_prefix = ""
parentdir_prefix = "frequensolve-"


[tool.setuptools]
packages = ["frequensolve"]
version = {attr = "frequensolve.__version__"}

[build-system]
requires = ["poetry-core", "setuptools>=45", "wheel", "versioneer[toml]>=0.29"]
build-backend = "poetry.core.masonry.api"
