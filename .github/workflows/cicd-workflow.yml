name: CI

permissions:
  contents: read
  actions: read
  packages: read

on:
  pull_request:
    branches: [ "v2" ]
  push:
    branches: [ "v2" ]
  workflow_dispatch:
    inputs:
      RUN_DOCKER_IMAGE_INTEGRATION:
        description: 'Run the downstream Docker image integration gate'
        required: false
        default: false
        type: boolean
      FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH:
        description: 'Branch of FrequenSolveDockerImage repository to use'
        required: false
        default: 'main'
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This job runs the deterministic Python lane only. The paid Docker/solver
  # workflow remains an explicit manual dispatch or release-candidate gate.
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,parallel,cloud]"

    - name: Run pre-commit
      if: matrix.python-version == '3.10'
      run: pre-commit run --show-diff-on-failure --color=always --all-files

    - name: Validate optional-extra and approval-marker contracts
      if: matrix.python-version == '3.10'
      run: make validate-optional-extra-contracts

    - name: Run incremental strict type check
      if: matrix.python-version == '3.10'
      run: make typecheck

    - name: Run deterministic tests
      if: matrix.python-version != '3.10'
      run: python -m pytest

    - name: Run deterministic tests with coverage ratchet
      if: matrix.python-version == '3.10'
      run: make test

    - name: Preserve coverage report for the OIDC upload job
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: coverage-report
        path: coverage.xml
        if-no-files-found: error
        retention-days: 7

  coverage-upload:
    name: Upload coverage to Codecov
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
    - name: Download coverage report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-report

    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      with:
        use_oidc: true
        fail_ci_if_error: true
        files: ./coverage.xml
        disable_search: true

  optional-extra-matrix:
    name: Build optional-extra test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.contracts.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Load executable package contract matrix
      id: contracts
      run: |
        python -m pip install packaging toml
        echo "matrix=$(python scripts/check_optional_extra_contracts.py --matrix)" >> "$GITHUB_OUTPUT"

  optional-extras:
    name: Optional contract (${{ matrix.contract }}, ${{ matrix.distribution }})
    needs: [build-package, optional-extra-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.optional-extra-matrix.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.10 for lower-bound resolution
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"

    - name: Download built distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/

    - name: Resolve declared direct lower bounds
      env:
        CONTRACT: ${{ matrix.contract }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install packaging toml
        python scripts/check_optional_extra_contracts.py \
          --lower-bound-requirements "$CONTRACT" \
          > "/tmp/frequensolve-${CONTRACT}-lower-bounds.txt"
        python -m pip install \
          --dry-run \
          --ignore-installed \
          -r "/tmp/frequensolve-${CONTRACT}-lower-bounds.txt"

    - name: Set up Python 3.12 for built-package behavior
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install clean built-package contract
      env:
        CONTRACT: ${{ matrix.contract }}
        DISTRIBUTION: ${{ matrix.distribution }}
      run: |
        set -euo pipefail
        if [ "$DISTRIBUTION" = wheel ]; then
          package="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
        else
          package="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
        fi
        test -n "$package"
        python -m pip install \
          "pytest>=8.0.0,<9.0.0" \
          "pytest-cov>=4.1.0,<7.0.0" \
          "pytest-mpl>=0.16.1,<0.18.0" \
          "pytest-mock>=3.12.0,<4.0.0" \
          "pytest-timeout>=2.2.0,<3.0.0"
        if [ "$CONTRACT" = base ]; then
          python -m pip install "$package"
        else
          python -m pip install "${package}[${CONTRACT}]"
        fi

    - name: Run installed-package behavior contract
      env:
        CONTRACT: ${{ matrix.contract }}
      run: |
        python scripts/check_optional_extra_contracts.py \
          --run "$CONTRACT" \
          --coverage-output "tests/output/optional-${CONTRACT}-coverage.json"

    - name: Upload optional contract coverage
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: optional-${{ matrix.contract }}-coverage
        path: |
          tests/output/optional-${{ matrix.contract }}-coverage.json
          tests/output/visual-comparisons/
        if-no-files-found: error
        retention-days: 7

  integration-test:
    # This job runs all tests (including integration) in the docker image with the solver software.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.RUN_DOCKER_IMAGE_INTEGRATION }}
    needs: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: docker-image-integration-${{ github.event_name == 'workflow_dispatch' && inputs.FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH || 'main' }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Generate GitHub App Token
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage

      - name: Trigger and wait for Docker Image workflow
        id: docker-workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          DOWNSTREAM_REPO: FrequenSol/FrequenSolveDockerImage
          DOWNSTREAM_WORKFLOW: cicd-workflow.yml
          DOWNSTREAM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH || 'main' }}
          FREQUENSOLVE_BRANCH: ${{ github.sha }}
        run: |
          set -euo pipefail

          dispatch_actor="${{ steps.generate-token.outputs.app-slug }}[bot]"
          dispatch_started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          gh workflow run "$DOWNSTREAM_WORKFLOW" \
            --repo "$DOWNSTREAM_REPO" \
            --ref "$DOWNSTREAM_REF" \
            -f FREQUENSOLVE_BRANCH="$FREQUENSOLVE_BRANCH" \
            -f DISABLE_PUSH=true

          deadline=$((SECONDS + 1800))
          run_id=""
          while [[ -z "$run_id" && $SECONDS -lt $deadline ]]; do
            sleep 10
            mapfile -t matching_runs < <(
              gh api "repos/$DOWNSTREAM_REPO/actions/workflows/$DOWNSTREAM_WORKFLOW/runs" \
                --method GET \
                -f branch="$DOWNSTREAM_REF" \
                -f event=workflow_dispatch \
                -f actor="$dispatch_actor" \
                -f created=">=$dispatch_started_at" \
                -F per_page=20 \
                --jq '.workflow_runs | sort_by(.created_at)[] | .id'
            )

            if [[ ${#matching_runs[@]} -gt 0 ]]; then
              run_id="${matching_runs[0]}"
            fi
          done

          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for downstream Docker image workflow to start." >&2
            exit 1
          fi

          echo "workflow-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "workflow-url=https://github.com/$DOWNSTREAM_REPO/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
          echo "Triggered downstream workflow: https://github.com/$DOWNSTREAM_REPO/actions/runs/$run_id"
          gh run watch "$run_id" --repo "$DOWNSTREAM_REPO" --interval 10 --exit-status

      - name: Download test evidence from Docker workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh run download "${{ steps.docker-workflow.outputs.workflow-id }}" \
            --repo FrequenSol/FrequenSolveDockerImage \
            --name frequensolve-test-evidence \
            --dir tests/output

      - name: Validate test evidence
        run: |
          python scripts/validate_heavy_test_evidence.py \
            tests/output/frequensolve-test-evidence.json \
            --commit "$GITHUB_SHA"

      - name: Preserve validated test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frequensolve-test-evidence
          path: tests/output/
          if-no-files-found: error
          retention-days: 7

  docs:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[docs]"

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: documentation
        path: docs/build/html/

  build-package:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"

    - name: Install packaging tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package metadata
      run: python -m twine check dist/*

    - name: Store build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: dist
        path: dist/

  package-smoke:
    name: Package smoke (${{ matrix.os }}, ${{ matrix.distribution }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        distribution: [wheel, sdist]
    steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Download built distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/

    - name: Install and import built distribution
      env:
        DISTRIBUTION: ${{ matrix.distribution }}
      run: |
        set -euo pipefail
        if [ "$DISTRIBUTION" = wheel ]; then
          package="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
        else
          package="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
        fi
        test -n "$package"
        python -m pip install --upgrade pip
        python -m pip install "$package"
        python -I - <<'PY'
        import frequensolve as fs

        for name in ("Project", "LayeredModel", "LocalSite", "AWSSite"):
            if getattr(fs, name, None) is None:
                raise SystemExit(f"missing installed-package export: {name}")
        print(fs.__version__)
        PY
        if [ "$DISTRIBUTION" = wheel ]; then
          python -m pip install "${package}[mcp]"
          frequensolve-mcp doctor
        fi

  required-ci:
    name: Required CI
    if: always()
    needs:
      - unit-test
      - coverage-upload
      - optional-extra-matrix
      - optional-extras
      - docs
      - build-package
      - package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every PR-safe CI lane
      env:
        UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
        COVERAGE_UPLOAD_RESULT: ${{ needs.coverage-upload.result }}
        OPTIONAL_EXTRAS_RESULT: ${{ needs.optional-extras.result }}
        OPTIONAL_EXTRA_MATRIX_RESULT: ${{ needs.optional-extra-matrix.result }}
        DOCS_RESULT: ${{ needs.docs.result }}
        BUILD_PACKAGE_RESULT: ${{ needs.build-package.result }}
        PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
      run: |
        set -euo pipefail
        for result in \
          "$UNIT_TEST_RESULT" \
          "$COVERAGE_UPLOAD_RESULT" \
          "$OPTIONAL_EXTRA_MATRIX_RESULT" \
          "$OPTIONAL_EXTRAS_RESULT" \
          "$DOCS_RESULT" \
          "$BUILD_PACKAGE_RESULT" \
          "$PACKAGE_SMOKE_RESULT"; do
          if [ "$result" != success ]; then
            echo "A required CI dependency finished with result: $result" >&2
            exit 1
          fi
        done
