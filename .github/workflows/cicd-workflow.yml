name: CI

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

on:
  pull_request:
    branches: [ "v2" ]
  push:
    branches: [ "v2" ]
  workflow_dispatch:
    inputs:
      FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH:
        description: 'Branch of FrequenSolveDockerImage repository to use'
        required: false
        default: 'main'
        type: string

jobs:
  # This job runs basic Python unit tests only - it does not test Docker functionality
  # or integration with other services. For full integration testing, see the integration-test job.
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,parallel,cloud]"

    - name: Run pre-commit
      if: matrix.python-version == '3.10'
      run: pre-commit run --show-diff-on-failure --color=always --all-files

    - name: Run tests with pytest
      run: make test

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml

  integration-test:
    # This job runs all tests (including integration) in the docker image with the solver software.
    needs: unit-test
    runs-on: ubuntu-latest
    concurrency:
      group: docker-image-integration-${{ github.event_name == 'workflow_dispatch' && inputs.FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH || 'main' }}
      cancel-in-progress: false
    steps:
      # Generate GitHub App Token
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FREQUENSOLVER_BUILDER_APP_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage

      - name: Trigger and wait for Docker Image workflow
        id: docker-workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          DOWNSTREAM_REPO: FrequenSol/FrequenSolveDockerImage
          DOWNSTREAM_WORKFLOW: cicd-workflow.yml
          DOWNSTREAM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH || 'main' }}
          FREQUENSOLVE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          dispatch_actor="$(gh api user --jq .login)"
          dispatch_started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          gh workflow run "$DOWNSTREAM_WORKFLOW" \
            --repo "$DOWNSTREAM_REPO" \
            --ref "$DOWNSTREAM_REF" \
            -f FREQUENSOLVE_BRANCH="$FREQUENSOLVE_BRANCH" \
            -f DISABLE_PUSH=true

          deadline=$((SECONDS + 1800))
          run_id=""
          while [[ -z "$run_id" && $SECONDS -lt $deadline ]]; do
            sleep 10
            mapfile -t matching_runs < <(
              gh api "repos/$DOWNSTREAM_REPO/actions/workflows/$DOWNSTREAM_WORKFLOW/runs" \
                --method GET \
                -f branch="$DOWNSTREAM_REF" \
                -f event=workflow_dispatch \
                -f actor="$dispatch_actor" \
                -f created=">=$dispatch_started_at" \
                -F per_page=20 \
                --jq '.workflow_runs | sort_by(.created_at)[] | .id'
            )

            if [[ ${#matching_runs[@]} -gt 0 ]]; then
              run_id="${matching_runs[0]}"
            fi
          done

          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for downstream Docker image workflow to start." >&2
            exit 1
          fi

          echo "workflow-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "workflow-url=https://github.com/$DOWNSTREAM_REPO/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
          echo "Triggered downstream workflow: https://github.com/$DOWNSTREAM_REPO/actions/runs/$run_id"
          gh run watch "$run_id" --repo "$DOWNSTREAM_REPO" --interval 10 --exit-status

      - name: Download test results from Docker workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh run download "${{ steps.docker-workflow.outputs.workflow-id }}" \
            --repo FrequenSol/FrequenSolveDockerImage \
            --name test-results \
            --dir tests/output

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/output/
          retention-days: 7

  docs:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[docs]"

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      with:
        name: documentation
        path: docs/build/html/

  build-package:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install packaging tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package metadata
      run: python -m twine check dist/*

    - name: Store build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
