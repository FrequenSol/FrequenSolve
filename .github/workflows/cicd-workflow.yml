name: CI

permissions:
  contents: read
  actions: read
  packages: read

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH:
        description: 'Branch of FrequenSolveDockerImage repository to use'
        required: false
        default: 'main'
        type: string

jobs:
  # This job runs basic Python unit tests only - it does not test Docker functionality
  # or integration with other services. For full integration testing, see the integration-test job.
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,parallel]"

    - name: Run pre-commit
      if: matrix.python-version == '3.12'
      uses: pre-commit/action@v3.0.0

    - name: Run tests with pytest
      run: make test

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    # This job runs all tests (including integration) in the docker image with the solver software.
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      # Generate GitHub App Token
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.FREQUENSOLVER_BUILDER_APP_ID }}
          private_key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}

      - name: Trigger and wait for Docker Image workflow
        id: docker-workflow
        uses: the-actions-org/workflow-dispatch@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repo: FrequenSol/FrequenSolveDockerImage
          workflow: cicd-workflow.yml
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.FREQUENSOLVEDOCKERIMAGE_REPO_BRANCH || 'main' }}
          inputs: '{"FREQUENSOLVE_BRANCH": "${{ github.event_name == ''pull_request'' && github.head_ref || github.ref_name }}", "DISABLE_PUSH": true}'
          wait-for-completion: true
          wait-for-completion-timeout: 30m
          wait-for-completion-interval: 10s
          display-workflow-run-url: true

      - name: Download test results from Docker workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          workflow: cicd-workflow.yml
          run_id: ${{ steps.docker-workflow.outputs.workflow-id }}
          repo: FrequenSol/FrequenSolveDockerImage
          name: test-results
          path: tests/output

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/output/
          retention-days: 7

  docs:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[docs]"

    - name: Build documentation
      run: make -C docs html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/build/html/

  build-package:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Build package
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
        python -m build
        python -m twine check dist/*

    - name: Store build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  deploy-docs:
    needs: [docs, build-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs/build/html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Initialize Terraform
        working-directory: docs/host
        run: terraform init

      - name: Deploy documentation
        working-directory: docs/host
        run: make deploy-all
