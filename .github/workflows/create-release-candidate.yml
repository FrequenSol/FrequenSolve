name: Create Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final package version to create a release candidate for, such as 0.2.0
        required: true
        type: string
      target_ref:
        description: Repository ref to release from
        required: true
        default: v2
        type: string
      frequensolver_release:
        description: Immutable final FrequenSolver release tag tested with this package, such as v0.1.0
        required: true
        type: string
      notes:
        description: Optional release candidate notes
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-evidence:
    name: Resolve source and require exact-SHA CI
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      ci_run_id: ${{ steps.prepare.outputs.ci_run_id }}
      ci_run_url: ${{ steps.prepare.outputs.ci_run_url }}
      frequensolver_release: ${{ steps.prepare.outputs.frequensolver_release }}
      frequensolver_commit: ${{ steps.prepare.outputs.frequensolver_commit }}
      frequensolver_release_url: ${{ steps.prepare.outputs.frequensolver_release_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Generate evidence-read token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolve, Sauce
          permission-actions: read
          permission-contents: read

      - name: Resolve immutable source and CI evidence
        id: prepare
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          FREQUENSOLVER_RELEASE: ${{ inputs.frequensolver_release }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          if git rev-parse --verify --quiet "origin/${TARGET_REF}^{commit}" >/dev/null; then
            target_sha="$(git rev-parse "origin/${TARGET_REF}^{commit}")"
          else
            target_sha="$(git rev-parse --verify "${TARGET_REF}^{commit}")"
          fi

          ci_evidence="$(
            python scripts/verify_ci_evidence.py \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$target_sha"
          )"
          ci_run_id="$(jq -r '.runId' <<<"$ci_evidence")"
          ci_run_url="$(jq -r '.runUrl' <<<"$ci_evidence")"

          if [[ ! "$FREQUENSOLVER_RELEASE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "FrequenSolver release must be a final canonical vX.Y.Z tag." >&2
            exit 1
          fi
          frequensolver_release="$(
            gh api "repos/FrequenSol/Sauce/releases/tags/${FREQUENSOLVER_RELEASE}"
          )"
          test "$(jq -r '.tag_name' <<<"$frequensolver_release")" = "$FREQUENSOLVER_RELEASE"
          test "$(jq -r '.draft | tostring' <<<"$frequensolver_release")" = false
          test "$(jq -r '.prerelease | tostring' <<<"$frequensolver_release")" = false
          frequensolver_release_url="$(jq -r '.html_url' <<<"$frequensolver_release")"
          test "$frequensolver_release_url" = "https://github.com/FrequenSol/Sauce/releases/tag/${FREQUENSOLVER_RELEASE}"
          frequensolver_commit="$(
            gh api "repos/FrequenSol/Sauce/commits/${FREQUENSOLVER_RELEASE}" --jq .sha
          )"
          [[ "$frequensolver_commit" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "target_sha=$target_sha"
            echo "ci_run_id=$ci_run_id"
            echo "ci_run_url=$ci_run_url"
            echo "frequensolver_release=$FREQUENSOLVER_RELEASE"
            echo "frequensolver_commit=$frequensolver_commit"
            echo "frequensolver_release_url=$frequensolver_release_url"
          } >> "$GITHUB_OUTPUT"

  docker-integration:
    name: Manual FrequenSolver-backed release evidence
    needs: prepare-evidence
    runs-on: ubuntu-latest
    # Allow the 30-minute dispatch-discovery window plus four bounded polling
    # windows around the downstream workflow's 180-minute build timeout.
    timeout-minutes: 260
    permissions:
      actions: read
      contents: read
    outputs:
      sauce_ref: ${{ steps.evidence.outputs.sauce_ref }}
      sauce_commit: ${{ steps.evidence.outputs.sauce_commit }}
      frequensolver_version: ${{ steps.evidence.outputs.frequensolver_version }}
      frequensolver_build_id: ${{ steps.evidence.outputs.frequensolver_build_id }}
      frequensolver_git_commit: ${{ steps.evidence.outputs.frequensolver_git_commit }}
      fs_mumps_ref: ${{ steps.evidence.outputs.fs_mumps_ref }}
      fs_mumps_commit: ${{ steps.evidence.outputs.fs_mumps_commit }}
      frequensolve_ref: ${{ steps.evidence.outputs.frequensolve_ref }}
      frequensolve_commit: ${{ steps.evidence.outputs.frequensolve_commit }}
      dockerimage_commit: ${{ steps.evidence.outputs.dockerimage_commit }}
      image_tag: ${{ steps.evidence.outputs.image_tag }}
      frequensolve_test_marker: ${{ steps.evidence.outputs.frequensolve_test_marker }}
      frequensolve_test_status: ${{ steps.evidence.outputs.frequensolve_test_status }}
      frequensolve_test_artifact: ${{ steps.evidence.outputs.frequensolve_test_artifact }}
      evidence_run_id: ${{ steps.dispatch.outputs.run_id }}
      evidence_run_url: ${{ steps.dispatch.outputs.run_url }}
      request_id: ${{ steps.dispatch.outputs.request_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate dependency resolution token
        id: resolve-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage, FS_MUMPS
          permission-contents: read

      - name: Resolve exact downstream inputs
        id: resolve
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          DOCKER_WORKFLOW_COMMIT: 6c7ffe8c60ae544060cbe7a4c046bb6b05f87729
        run: |
          set -euo pipefail
          docker_main="$(
            gh api repos/FrequenSol/FrequenSolveDockerImage/commits/main --jq .sha
          )"
          if [ "$docker_main" != "$DOCKER_WORKFLOW_COMMIT" ]; then
            echo "DockerImage main moved to ${docker_main}; update and review the pinned release workflow commit." >&2
            exit 1
          fi
          fs_mumps_commit="$(
            gh api repos/FrequenSol/FS_MUMPS/commits/main --jq .sha
          )"
          [[ "$fs_mumps_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "fs_mumps_commit=$fs_mumps_commit" >> "$GITHUB_OUTPUT"

      - name: Generate downstream dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage
          permission-actions: write
          permission-contents: read

      - name: Dispatch exact DockerImage evidence run
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          DOWNSTREAM_REPO: FrequenSol/FrequenSolveDockerImage
          DOWNSTREAM_WORKFLOW: cicd-workflow.yml
          DOWNSTREAM_REF: main
          DOCKER_WORKFLOW_COMMIT: 6c7ffe8c60ae544060cbe7a4c046bb6b05f87729
          FREQUENSOLVER_RELEASE: ${{ needs.prepare-evidence.outputs.frequensolver_release }}
          FS_MUMPS_COMMIT: ${{ steps.resolve.outputs.fs_mumps_commit }}
          FREQUENSOLVE_COMMIT: ${{ needs.prepare-evidence.outputs.target_sha }}
          DISPATCH_ACTOR: ${{ steps.dispatch-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          nonce="$(openssl rand -hex 16)"
          request_id="frequensolve-rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${nonce}"
          dispatch_started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          gh workflow run "$DOWNSTREAM_WORKFLOW" \
            --repo "$DOWNSTREAM_REPO" \
            --ref "$DOWNSTREAM_REF" \
            -f SOURCE_REF="$DOWNSTREAM_REF" \
            -f SOURCE_COMMIT="$DOCKER_WORKFLOW_COMMIT" \
            -f REQUEST_ID="$request_id" \
            -f SAUCE_REF="$FREQUENSOLVER_RELEASE" \
            -f FS_MUMPS_REF="$FS_MUMPS_COMMIT" \
            -f FREQUENSOLVE_BRANCH="$FREQUENSOLVE_COMMIT" \
            -f FREQUENSOLVE_SOURCE=git \
            -f DISABLE_PUSH=true

          deadline=$((SECONDS + 1800))
          run_id=""
          while [ -z "$run_id" ] && [ "$SECONDS" -lt "$deadline" ]; do
            gh api "repos/${DOWNSTREAM_REPO}/actions/workflows/${DOWNSTREAM_WORKFLOW}/runs" \
              --method GET \
              -f branch="$DOWNSTREAM_REF" \
              -f event=workflow_dispatch \
              -f actor="$DISPATCH_ACTOR" \
              -f created=">=${dispatch_started_at}" \
              -F per_page=20 > downstream-runs.json
            set +e
            run_id="$(
              python scripts/select_docker_workflow_evidence.py run \
                downstream-runs.json \
                --request-id "$request_id" \
                --actor "$DISPATCH_ACTOR" \
                --head-sha "$DOCKER_WORKFLOW_COMMIT" \
                --created-after "$dispatch_started_at" \
                --allow-missing
            )"
            select_status=$?
            set -e
            case "$select_status" in
              0) ;;
              3) run_id=""; sleep 10 ;;
              *) exit "$select_status" ;;
            esac
          done
          if [ -z "$run_id" ]; then
            echo "Timed out waiting for the exact DockerImage workflow run." >&2
            exit 1
          fi

          run_url="https://github.com/${DOWNSTREAM_REPO}/actions/runs/${run_id}"
          {
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "request_id=$request_id"
            echo "actor=$DISPATCH_ACTOR"
            echo "started_at=$dispatch_started_at"
          } >> "$GITHUB_OUTPUT"
          echo "Triggered exact downstream workflow: $run_url"

      - name: Generate first downstream wait token
        id: wait-token-1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage
          permission-actions: read

      - name: Wait for downstream evidence (window 1)
        id: wait-1
        env:
          GH_TOKEN: ${{ steps.wait-token-1.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          python scripts/wait_for_docker_workflow_run.py \
            --run-id "$RUN_ID" \
            --timeout-seconds 3000 \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate second downstream wait token
        if: ${{ steps.wait-1.outputs.completed != 'true' }}
        id: wait-token-2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage
          permission-actions: read

      - name: Wait for downstream evidence (window 2)
        if: ${{ steps.wait-1.outputs.completed != 'true' }}
        id: wait-2
        env:
          GH_TOKEN: ${{ steps.wait-token-2.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          python scripts/wait_for_docker_workflow_run.py \
            --run-id "$RUN_ID" \
            --timeout-seconds 3000 \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate third downstream wait token
        if: ${{ steps.wait-1.outputs.completed != 'true' && steps.wait-2.outputs.completed != 'true' }}
        id: wait-token-3
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage
          permission-actions: read

      - name: Wait for downstream evidence (window 3)
        if: ${{ steps.wait-1.outputs.completed != 'true' && steps.wait-2.outputs.completed != 'true' }}
        id: wait-3
        env:
          GH_TOKEN: ${{ steps.wait-token-3.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          python scripts/wait_for_docker_workflow_run.py \
            --run-id "$RUN_ID" \
            --timeout-seconds 3000 \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate fourth downstream wait token
        if: ${{ steps.wait-1.outputs.completed != 'true' && steps.wait-2.outputs.completed != 'true' && steps.wait-3.outputs.completed != 'true' }}
        id: wait-token-4
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage
          permission-actions: read

      - name: Wait for downstream evidence (window 4)
        if: ${{ steps.wait-1.outputs.completed != 'true' && steps.wait-2.outputs.completed != 'true' && steps.wait-3.outputs.completed != 'true' }}
        id: wait-4
        env:
          GH_TOKEN: ${{ steps.wait-token-4.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          python scripts/wait_for_docker_workflow_run.py \
            --run-id "$RUN_ID" \
            --timeout-seconds 3000 \
            --github-output "$GITHUB_OUTPUT"

      - name: Require downstream completion within bounded windows
        if: ${{ steps.wait-1.outputs.completed != 'true' && steps.wait-2.outputs.completed != 'true' && steps.wait-3.outputs.completed != 'true' && steps.wait-4.outputs.completed != 'true' }}
        run: |
          echo "DockerImage evidence run did not complete within 200 minutes." >&2
          exit 1

      - name: Generate downstream evidence token
        id: evidence-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolveDockerImage
          permission-actions: read

      - name: Download exact downstream evidence artifact
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          DOWNSTREAM_REPO: FrequenSol/FrequenSolveDockerImage
          DOWNSTREAM_WORKFLOW: cicd-workflow.yml
          DOWNSTREAM_REF: main
          DOCKER_WORKFLOW_COMMIT: 6c7ffe8c60ae544060cbe7a4c046bb6b05f87729
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          REQUEST_ID: ${{ steps.dispatch.outputs.request_id }}
          DISPATCH_ACTOR: ${{ steps.dispatch.outputs.actor }}
          DISPATCH_STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          gh api "repos/${DOWNSTREAM_REPO}/actions/workflows/${DOWNSTREAM_WORKFLOW}/runs" \
            --method GET \
            -f branch="$DOWNSTREAM_REF" \
            -f event=workflow_dispatch \
            -f actor="$DISPATCH_ACTOR" \
            -f created=">=${DISPATCH_STARTED_AT}" \
            -F per_page=100 > completed-downstream-runs.json
          selected_run_id="$(
            python scripts/select_docker_workflow_evidence.py run \
              completed-downstream-runs.json \
              --request-id "$REQUEST_ID" \
              --actor "$DISPATCH_ACTOR" \
              --head-sha "$DOCKER_WORKFLOW_COMMIT" \
              --created-after "$DISPATCH_STARTED_AT" \
              --require-success
          )"
          test "$selected_run_id" = "$RUN_ID"
          gh api "repos/${DOWNSTREAM_REPO}/actions/runs/${RUN_ID}/artifacts" \
            --method GET \
            -F per_page=100 > downstream-artifacts.json
          python scripts/select_docker_workflow_evidence.py artifact \
            downstream-artifacts.json >/dev/null
          gh run download "$RUN_ID" \
            --repo "$DOWNSTREAM_REPO" \
            --name frequensolve-test-evidence \
            --dir .solver-evidence

      - name: Validate exact downstream evidence
        id: evidence
        env:
          TARGET_SHA: ${{ needs.prepare-evidence.outputs.target_sha }}
          FREQUENSOLVER_RELEASE: ${{ needs.prepare-evidence.outputs.frequensolver_release }}
          FREQUENSOLVER_EXPECTED_COMMIT: ${{ needs.prepare-evidence.outputs.frequensolver_commit }}
          FS_MUMPS_COMMIT: ${{ steps.resolve.outputs.fs_mumps_commit }}
          DOCKER_WORKFLOW_COMMIT: 6c7ffe8c60ae544060cbe7a4c046bb6b05f87729
          DOCKER_EVIDENCE_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          DOCKER_REQUEST_ID: ${{ steps.dispatch.outputs.request_id }}
        run: |
          set -euo pipefail
          heavy_evidence=.solver-evidence/frequensolve-test-evidence.json
          frequensolver_identity=.solver-evidence/frequensolver-identity.json
          dispatch_evidence=.solver-evidence/docker-dispatch-evidence.json
          test -f "$heavy_evidence"
          test -f "$frequensolver_identity"
          test -f "$dispatch_evidence"
          test ! -L "$heavy_evidence"
          test ! -L "$frequensolver_identity"
          test ! -L "$dispatch_evidence"
          python scripts/validate_heavy_test_evidence.py \
            "$heavy_evidence" \
            --commit "$TARGET_SHA"

          frequensolver_version="$(jq -er .version "$frequensolver_identity")"
          frequensolver_build_id="$(jq -er .build_id "$frequensolver_identity")"
          frequensolver_git_commit="$(jq -er .git_commit "$frequensolver_identity")"
          python scripts/validate_frequensolver_identity.py \
            "$frequensolver_identity" \
            --version "$FREQUENSOLVER_RELEASE" \
            --commit "$FREQUENSOLVER_EXPECTED_COMMIT" \
            --build-id="$frequensolver_build_id"
          test "$frequensolver_version" = "$FREQUENSOLVER_RELEASE"
          test "$frequensolver_git_commit" = "$FREQUENSOLVER_EXPECTED_COMMIT"
          python scripts/validate_docker_dispatch_evidence.py \
            "$dispatch_evidence" \
            --run-id "$DOCKER_EVIDENCE_RUN_ID" \
            --request-id "$DOCKER_REQUEST_ID" \
            --workflow-commit "$DOCKER_WORKFLOW_COMMIT" \
            --source-ref main \
            --sauce-ref "$FREQUENSOLVER_RELEASE" \
            --sauce-commit "$FREQUENSOLVER_EXPECTED_COMMIT" \
            --fs-mumps-commit "$FS_MUMPS_COMMIT" \
            --frequensolve-commit "$TARGET_SHA"

          {
            echo "sauce_ref=$FREQUENSOLVER_RELEASE"
            echo "sauce_commit=$frequensolver_git_commit"
            echo "frequensolver_version=$frequensolver_version"
            echo "frequensolver_build_id=$frequensolver_build_id"
            echo "frequensolver_git_commit=$frequensolver_git_commit"
            echo "fs_mumps_ref=$FS_MUMPS_COMMIT"
            echo "fs_mumps_commit=$FS_MUMPS_COMMIT"
            echo "frequensolve_ref=$TARGET_SHA"
            echo "frequensolve_commit=$TARGET_SHA"
            echo "dockerimage_commit=$DOCKER_WORKFLOW_COMMIT"
            echo "image_tag=$DOCKER_WORKFLOW_COMMIT"
            echo "frequensolve_test_marker=not cloud and not hpc and not interactive"
            echo "frequensolve_test_status=passed"
            echo "frequensolve_test_artifact=frequensolve-test-evidence"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve validated evidence in the caller run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frequensolve-test-evidence
          path: .solver-evidence/
          if-no-files-found: error
          retention-days: 90

  create-release-candidate:
    name: Create release candidate after evidence passes
    needs:
      - prepare-evidence
      - docker-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Generate release token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolve
          permission-actions: read
          permission-contents: write

      - name: Download solver-backed test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frequensolve-test-evidence
          path: .solver-evidence
          github-token: ${{ steps.generate-token.outputs.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate and seal release evidence
        env:
          TARGET_SHA: ${{ needs.prepare-evidence.outputs.target_sha }}
          CI_RUN_ID: ${{ needs.prepare-evidence.outputs.ci_run_id }}
          CI_RUN_URL: ${{ needs.prepare-evidence.outputs.ci_run_url }}
          DOCKER_REF: ${{ needs.docker-integration.outputs.frequensolve_ref }}
          DOCKER_COMMIT: ${{ needs.docker-integration.outputs.frequensolve_commit }}
          DOCKER_WORKFLOW_COMMIT: ${{ needs.docker-integration.outputs.dockerimage_commit }}
          DOCKER_EVIDENCE_RUN_ID: ${{ needs.docker-integration.outputs.evidence_run_id }}
          DOCKER_EVIDENCE_RUN_URL: ${{ needs.docker-integration.outputs.evidence_run_url }}
          DOCKER_REQUEST_ID: ${{ needs.docker-integration.outputs.request_id }}
          DOCKER_MARKER: ${{ needs.docker-integration.outputs.frequensolve_test_marker }}
          DOCKER_STATUS: ${{ needs.docker-integration.outputs.frequensolve_test_status }}
          DOCKER_ARTIFACT: ${{ needs.docker-integration.outputs.frequensolve_test_artifact }}
          DOCKER_IMAGE_TAG: ${{ needs.docker-integration.outputs.image_tag }}
          SAUCE_REF: ${{ needs.docker-integration.outputs.sauce_ref }}
          SAUCE_COMMIT: ${{ needs.docker-integration.outputs.sauce_commit }}
          FREQUENSOLVER_RELEASE: ${{ needs.prepare-evidence.outputs.frequensolver_release }}
          FREQUENSOLVER_EXPECTED_COMMIT: ${{ needs.prepare-evidence.outputs.frequensolver_commit }}
          FREQUENSOLVER_RELEASE_URL: ${{ needs.prepare-evidence.outputs.frequensolver_release_url }}
          FREQUENSOLVER_VERSION: ${{ needs.docker-integration.outputs.frequensolver_version }}
          FREQUENSOLVER_BUILD_ID: ${{ needs.docker-integration.outputs.frequensolver_build_id }}
          FREQUENSOLVER_GIT_COMMIT: ${{ needs.docker-integration.outputs.frequensolver_git_commit }}
          FS_MUMPS_REF: ${{ needs.docker-integration.outputs.fs_mumps_ref }}
          FS_MUMPS_COMMIT: ${{ needs.docker-integration.outputs.fs_mumps_commit }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          test "$DOCKER_REF" = "$TARGET_SHA"
          test "$DOCKER_COMMIT" = "$TARGET_SHA"
          test "$DOCKER_WORKFLOW_COMMIT" = 6c7ffe8c60ae544060cbe7a4c046bb6b05f87729
          test "$DOCKER_MARKER" = "not cloud and not hpc and not interactive"
          test "$DOCKER_STATUS" = passed
          test "$DOCKER_ARTIFACT" = frequensolve-test-evidence
          test -n "$DOCKER_IMAGE_TAG"
          test "$SAUCE_REF" = "$FREQUENSOLVER_RELEASE"
          test "$SAUCE_COMMIT" = "$FREQUENSOLVER_EXPECTED_COMMIT"
          test "$FREQUENSOLVER_VERSION" = "$FREQUENSOLVER_RELEASE"
          test -n "$FREQUENSOLVER_BUILD_ID"
          test "$FREQUENSOLVER_GIT_COMMIT" = "$SAUCE_COMMIT"
          test "$FS_MUMPS_REF" = "$FS_MUMPS_COMMIT"
          [[ "$SAUCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FS_MUMPS_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FS_MUMPS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DOCKER_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$DOCKER_EVIDENCE_RUN_URL" = "https://github.com/FrequenSol/FrequenSolveDockerImage/actions/runs/${DOCKER_EVIDENCE_RUN_ID}"
          [[ "$DOCKER_REQUEST_ID" =~ ^frequensolve-rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-[0-9a-f]{32}$ ]]

          heavy_evidence=.solver-evidence/frequensolve-test-evidence.json
          frequensolver_identity=.solver-evidence/frequensolver-identity.json
          dispatch_evidence=.solver-evidence/docker-dispatch-evidence.json
          python scripts/validate_heavy_test_evidence.py \
            "$heavy_evidence" \
            --commit "$TARGET_SHA"
          python scripts/validate_frequensolver_identity.py \
            "$frequensolver_identity" \
            --version "$FREQUENSOLVER_VERSION" \
            --commit "$FREQUENSOLVER_GIT_COMMIT" \
            --build-id="$FREQUENSOLVER_BUILD_ID"
          python scripts/validate_docker_dispatch_evidence.py \
            "$dispatch_evidence" \
            --run-id "$DOCKER_EVIDENCE_RUN_ID" \
            --request-id "$DOCKER_REQUEST_ID" \
            --workflow-commit "$DOCKER_WORKFLOW_COMMIT" \
            --source-ref main \
            --sauce-ref "$SAUCE_REF" \
            --sauce-commit "$SAUCE_COMMIT" \
            --fs-mumps-commit "$FS_MUMPS_COMMIT" \
            --frequensolve-commit "$TARGET_SHA"
          tar -czf frequensolve-test-evidence.tar.gz -C .solver-evidence .
          archive_sha256="$(sha256sum frequensolve-test-evidence.tar.gz | awk '{print $1}')"

          python scripts/verify_ci_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$TARGET_SHA" \
            --run-id "$CI_RUN_ID"

          jq -n \
            --arg schemaVersion "frequensolve-release-evidence/v2" \
            --arg commit "$TARGET_SHA" \
            --argjson ciRunId "$CI_RUN_ID" \
            --arg ciRunUrl "$CI_RUN_URL" \
            --arg ciWorkflow ".github/workflows/cicd-workflow.yml" \
            --arg ciRequiredJob "Required CI" \
            --arg dockerWorkflow "FrequenSol/FrequenSolveDockerImage/.github/workflows/cicd-workflow.yml@6c7ffe8c60ae544060cbe7a4c046bb6b05f87729" \
            --arg dockerWorkflowCommit "$DOCKER_WORKFLOW_COMMIT" \
            --argjson dockerCallerRunId "$GITHUB_RUN_ID" \
            --arg dockerCallerRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson dockerEvidenceRunId "$DOCKER_EVIDENCE_RUN_ID" \
            --arg dockerEvidenceRunUrl "$DOCKER_EVIDENCE_RUN_URL" \
            --arg dockerRequestId "$DOCKER_REQUEST_ID" \
            --arg dockerImageTag "$DOCKER_IMAGE_TAG" \
            --arg dockerTestRef "$DOCKER_REF" \
            --arg dockerTestCommit "$DOCKER_COMMIT" \
            --arg dockerTestMarker "$DOCKER_MARKER" \
            --arg dockerTestStatus "$DOCKER_STATUS" \
            --arg dockerTestArtifact "$DOCKER_ARTIFACT" \
            --arg dockerTestArchiveSha256 "$archive_sha256" \
            --slurpfile dockerTestEvidence "$heavy_evidence" \
            --slurpfile dockerDispatchEvidence "$dispatch_evidence" \
            --arg sauceRef "$SAUCE_REF" \
            --arg sauceCommit "$SAUCE_COMMIT" \
            --arg frequensolverRelease "$FREQUENSOLVER_RELEASE" \
            --arg frequensolverReleaseUrl "$FREQUENSOLVER_RELEASE_URL" \
            --arg frequensolverVersion "$FREQUENSOLVER_VERSION" \
            --arg frequensolverBuildId "$FREQUENSOLVER_BUILD_ID" \
            --arg frequensolverGitCommit "$FREQUENSOLVER_GIT_COMMIT" \
            --arg fsMumpsRef "$FS_MUMPS_REF" \
            --arg fsMumpsCommit "$FS_MUMPS_COMMIT" \
            '{
              schemaVersion: $schemaVersion,
              commit: $commit,
              ciRunId: $ciRunId,
              ciRunUrl: $ciRunUrl,
              ciWorkflow: $ciWorkflow,
              ciRequiredJob: $ciRequiredJob,
              dockerWorkflow: $dockerWorkflow,
              dockerWorkflowCommit: $dockerWorkflowCommit,
              dockerCallerRunId: $dockerCallerRunId,
              dockerCallerRunUrl: $dockerCallerRunUrl,
              dockerEvidenceRunId: $dockerEvidenceRunId,
              dockerEvidenceRunUrl: $dockerEvidenceRunUrl,
              dockerRequestId: $dockerRequestId,
              dockerImageTag: $dockerImageTag,
              dockerTestRef: $dockerTestRef,
              dockerTestCommit: $dockerTestCommit,
              dockerTestMarker: $dockerTestMarker,
              dockerTestStatus: $dockerTestStatus,
              dockerTestArtifact: $dockerTestArtifact,
              dockerTestArchiveSha256: $dockerTestArchiveSha256,
              dockerTestEvidence: $dockerTestEvidence[0],
              dockerDispatchEvidence: $dockerDispatchEvidence[0],
              sauceRef: $sauceRef,
              sauceCommit: $sauceCommit,
              frequensolverRelease: $frequensolverRelease,
              frequensolverReleaseUrl: $frequensolverReleaseUrl,
              frequensolverVersion: $frequensolverVersion,
              frequensolverBuildId: $frequensolverBuildId,
              frequensolverGitCommit: $frequensolverGitCommit,
              fsMumpsRef: $fsMumpsRef,
              fsMumpsCommit: $fsMumpsCommit
            }' > release-evidence.json

          python scripts/validate_release_evidence.py \
            release-evidence.json \
            --commit "$TARGET_SHA"

      - name: Preserve sealed release evidence in the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ needs.prepare-evidence.outputs.target_sha }}
          path: |
            release-evidence.json
            frequensolve-test-evidence.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Create release candidate
        env:
          VERSION: ${{ inputs.version }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_SHA: ${{ needs.prepare-evidence.outputs.target_sha }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

          args=(next-rc --version "$VERSION")
          while IFS= read -r existing_tag; do
            [ -z "$existing_tag" ] && continue
            args+=(--existing-tag "$existing_tag")
          done < <(git tag -l "v${VERSION}rc*")
          next_tag="$(python scripts/plan_release_tags.py "${args[@]}")"

          final_tag="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${final_tag}" >/dev/null; then
            echo "Final tag ${final_tag} already exists; refusing another candidate." >&2
            exit 1
          fi

          release_inventory="$(
            gh release list \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease
          )"
          if jq -e --arg tag "$final_tag" \
            'any(.[]; .tagName == $tag)' <<<"$release_inventory" >/dev/null; then
            echo "Final release ${final_tag} already exists; refusing another candidate." >&2
            exit 1
          fi

          next_number="${next_tag##*rc}"
          latest_tag=""
          if [ "$next_number" -gt 1 ]; then
            latest_tag="v${VERSION}rc$((next_number - 1))"
          fi

          tag_name="$next_tag"
          if [ -n "$latest_tag" ]; then
            latest_sha="$(git rev-parse "refs/tags/${latest_tag}^{commit}")"
            latest_release="$(
              jq -c --arg tag "$latest_tag" '
                [.[] | select(.tagName == $tag)] |
                if length > 1 then
                  error("duplicate GitHub releases for tag")
                else
                  .[0] // empty
                end
              ' <<<"$release_inventory"
            )"

            if [ -z "$latest_release" ]; then
              if [ "$latest_sha" != "$TARGET_SHA" ]; then
                echo "Unreleased tag ${latest_tag} points to ${latest_sha}, not ${TARGET_SHA}." >&2
                exit 1
              fi
              tag_name="$latest_tag"
              echo "Resuming orphaned tag ${tag_name} at ${TARGET_SHA}."
            else
              latest_prerelease="$(jq -r '.isPrerelease | tostring' <<<"$latest_release")"
              latest_draft="$(jq -r '.isDraft | tostring' <<<"$latest_release")"
              if [ "$latest_prerelease" != true ]; then
                echo "Existing ${latest_tag} is not a GitHub prerelease." >&2
                exit 1
              fi

              same_commit=false
              if [ "$latest_sha" = "$TARGET_SHA" ]; then
                same_commit=true
              fi

              retry_action="$(
                python scripts/plan_release_tags.py retry-action \
                  --same-commit "$same_commit" \
                  --draft "$latest_draft"
              )"
              case "$retry_action" in
                reuse)
                  tag_name="$latest_tag"
                  echo "Resuming draft ${tag_name}; it targets ${TARGET_SHA}."
                  ;;
                advance)
                  echo "Preserving published ${latest_tag}; creating ${tag_name}."
                  ;;
                fail)
                  echo "Draft ${latest_tag} points to ${latest_sha}, not ${TARGET_SHA}." >&2
                  exit 1
                  ;;
                *)
                  echo "Unexpected retry action: ${retry_action}" >&2
                  exit 1
                  ;;
              esac
            fi
          fi

          if git rev-parse --verify --quiet "refs/tags/${tag_name}" >/dev/null; then
            existing_sha="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
            if [ "$existing_sha" != "$TARGET_SHA" ]; then
              echo "Tag ${tag_name} points to ${existing_sha}, not ${TARGET_SHA}." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag_name" "$TARGET_SHA" -m "Create ${tag_name}"
            git push origin "refs/tags/${tag_name}"
          fi

          ci_run_url="$(jq -r '.ciRunUrl' release-evidence.json)"
          docker_run_url="$(jq -r '.dockerEvidenceRunUrl' release-evidence.json)"
          docker_image_tag="$(jq -r '.dockerImageTag' release-evidence.json)"
          frequensolver_release="$(jq -r '.frequensolverRelease' release-evidence.json)"
          frequensolver_release_url="$(jq -r '.frequensolverReleaseUrl' release-evidence.json)"
          {
            echo "FrequenSolve release candidate ${tag_name}"
            echo
            echo "- Source ref: ${TARGET_REF}"
            echo "- Source commit: ${TARGET_SHA}"
            echo "- Package version: ${tag_name#v}"
            echo "- Required CI: ${ci_run_url}"
            echo "- Solver evidence run: ${docker_run_url}"
            echo "- Preferred FrequenSolver: [${frequensolver_release}](${frequensolver_release_url})"
            echo "- Tested runtime image: ${docker_image_tag}"
            echo "- Publishing: TestPyPI via the Publish Package workflow"
            if [ -n "$NOTES" ]; then
              echo
              echo "$NOTES"
            fi
          } > release-notes.md

          selected_release="$(
            gh release list \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease |
              jq -c --arg tag "$tag_name" '
                [.[] | select(.tagName == $tag)] |
                if length > 1 then
                  error("duplicate GitHub releases for tag")
                else
                  .[0] // empty
                end
              '
          )"
          if [ -z "$selected_release" ]; then
            gh release create "$tag_name" \
              --verify-tag \
              --target "$TARGET_SHA" \
              --title "$tag_name" \
              --notes-file release-notes.md \
              --draft \
              --prerelease \
              --latest=false
            release_is_draft=true
          else
            selected_prerelease="$(
              jq -r '.isPrerelease | tostring' <<<"$selected_release"
            )"
            if [ "$selected_prerelease" != true ]; then
              echo "Existing ${tag_name} is not a GitHub prerelease." >&2
              exit 1
            fi
            release_is_draft="$(
              jq -r '.isDraft | tostring' <<<"$selected_release"
            )"
          fi

          selected_assets="$(gh release view "$tag_name" --json assets)"
          release_evidence_count="$(
            jq -r '[.assets[]? | select(.name == "release-evidence.json")] | length' \
              <<<"$selected_assets"
          )"
          heavy_archive_count="$(
            jq -r '[.assets[]? | select(.name == "frequensolve-test-evidence.tar.gz")] | length' \
              <<<"$selected_assets"
          )"

          if [ "$release_evidence_count" = 1 ] && \
             [ "$heavy_archive_count" = 1 ]; then
            existing_assets_dir="$(mktemp -d)"
            gh release download "$tag_name" \
              --pattern release-evidence.json \
              --dir "$existing_assets_dir"
            gh release download "$tag_name" \
              --pattern frequensolve-test-evidence.tar.gz \
              --dir "$existing_assets_dir"
            if comparison_output="$(
              python scripts/compare_release_evidence_pair.py \
                --expected-evidence release-evidence.json \
                --expected-archive frequensolve-test-evidence.tar.gz \
                --actual-evidence "$existing_assets_dir/release-evidence.json" \
                --actual-archive "$existing_assets_dir/frequensolve-test-evidence.tar.gz" \
                2>&1
            )"; then
              echo "$comparison_output"
            elif [ "$release_is_draft" = true ]; then
              echo "Replacing the mismatched evidence pair on draft ${tag_name}."
              echo "$comparison_output"
              gh release upload "$tag_name" \
                release-evidence.json \
                frequensolve-test-evidence.tar.gz \
                --clobber
            else
              echo "Published ${tag_name} already has a different sealed evidence pair; refusing to rewrite its notes or assets." >&2
              echo "$comparison_output" >&2
              exit 1
            fi
          elif [ "$release_is_draft" = true ]; then
            echo "Installing a complete evidence pair on draft ${tag_name}."
            gh release upload "$tag_name" \
              release-evidence.json \
              frequensolve-test-evidence.tar.gz \
              --clobber
          else
            echo "Published ${tag_name} has an incomplete evidence pair (${release_evidence_count} release-evidence.json, ${heavy_archive_count} heavy archive); refusing to rewrite it." >&2
            exit 1
          fi

          selected_assets="$(gh release view "$tag_name" --json assets)"
          jq -e '
            ([.assets[]? | select(.name == "release-evidence.json")] | length) == 1 and
            ([.assets[]? | select(.name == "frequensolve-test-evidence.tar.gz")] | length) == 1
          ' <<<"$selected_assets" >/dev/null

          gh release edit "$tag_name" \
            --verify-tag \
            --target "$TARGET_SHA" \
            --title "$tag_name" \
            --notes-file release-notes.md \
            --draft=false \
            --prerelease=true \
            --latest=false

          published_release="$(
            gh release view "$tag_name" --json tagName,isDraft,isPrerelease
          )"
          test "$(jq -r '.tagName' <<<"$published_release")" = "$tag_name"
          test "$(jq -r '.isDraft | tostring' <<<"$published_release")" = false
          test "$(jq -r '.isPrerelease | tostring' <<<"$published_release")" = true

          {
            echo "### Created release candidate"
            echo
            echo "- Tag: \`${tag_name}\`"
            echo "- Package version: \`${tag_name#v}\`"
            echo "- Exact source commit: \`${TARGET_SHA}\`"
            echo "- Preferred FrequenSolver: \`${frequensolver_release}\`"
            echo "- Publish target: TestPyPI"
          } >> "$GITHUB_STEP_SUMMARY"
