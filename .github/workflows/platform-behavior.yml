name: Native Platform Behavior

permissions:
  contents: read

on:
  pull_request:
    branches: [ "v2" ]
    paths:
      - ".github/workflows/platform-behavior.yml"
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
      - "versioneer.py"
      - "scripts/check_coverage_thresholds.py"
      - "scripts/run_platform_behavior.py"
      - "src/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      target:
        description: Native platform contract to run
        required: true
        default: linux-arm64
        type: choice
        options:
          - linux-arm64
          - macos
          - both

concurrency:
  group: platform-behavior-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-distribution:
    name: Build exact distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "build>=1.2.0,<2.0.0" \
            "twine>=6.0.0,<7.0.0"
          python -m build
          twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS

      - name: Retain exact distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  macos-behavior:
    name: macOS installed-package behavior
    if: >-
      github.event_name == 'pull_request' ||
      inputs.target == 'macos' ||
      inputs.target == 'both'
    needs: build-distribution
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-distributions-${{ github.sha }}
          path: dist/

      - name: Install exact built package and Linux-equivalent test environment
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$package"
          mkdir -p tests/output/platform-macos
          python -m pip install --upgrade pip
          python -m pip install \
            --report tests/output/platform-macos/pip-install-report.json \
            "${package}[dev,parallel,cloud]"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Run full native macOS contract
        run: |
          python scripts/run_platform_behavior.py \
            --suite full \
            --artifact "$PACKAGE" \
            --expected-system Darwin \
            --expected-machine arm64 \
            --commit "$GITHUB_SHA" \
            --install-report tests/output/platform-macos/pip-install-report.json \
            --output-dir tests/output/platform-macos

      - name: Retain macOS platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-macos-${{ github.sha }}
          path: tests/output/platform-macos/
          if-no-files-found: error
          retention-days: 14

  linux-arm64-behavior:
    name: Linux ARM64 installed-package behavior
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'linux-arm64' || inputs.target == 'both')
    needs: build-distribution
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-distributions-${{ github.sha }}
          path: dist/

      - name: Install minimal built package and core test harness
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$package"
          mkdir -p tests/output/platform-linux-arm64
          python -m pip install --upgrade pip
          python -m pip install \
            --report tests/output/platform-linux-arm64/pip-install-report.json \
            "$package" \
            "hypothesis>=6.100.0,<7.0.0" \
            "jsonschema>=4.23.0,<5.0.0" \
            "pytest>=8.0.0,<9.0.0" \
            "pytest-cov>=4.1.0,<7.0.0" \
            "pytest-timeout>=2.2.0,<3.0.0"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Run representative native Linux ARM64 contract
        run: |
          python scripts/run_platform_behavior.py \
            --suite core \
            --artifact "$PACKAGE" \
            --expected-system Linux \
            --expected-machine aarch64 \
            --commit "$GITHUB_SHA" \
            --install-report tests/output/platform-linux-arm64/pip-install-report.json \
            --output-dir tests/output/platform-linux-arm64

      - name: Retain Linux ARM64 platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-linux-arm64-${{ github.sha }}
          path: tests/output/platform-linux-arm64/
          if-no-files-found: error
          retention-days: 14
