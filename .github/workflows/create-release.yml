name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_candidate_tag:
        description: Release candidate tag to promote, such as v0.2.0rc1
        required: true
        type: string
      notes:
        description: Optional final release notes
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.FREQUENSOLVER_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.FREQUENSOLVER_BUILDER_APP_PRIVATE_KEY }}
          owner: FrequenSol
          repositories: FrequenSolve
          permission-actions: read
          permission-contents: write

      - name: Promote release candidate
        env:
          RC_TAG: ${{ github.event.inputs.release_candidate_tag }}
          NOTES: ${{ github.event.inputs.notes }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          final_tag="$(python scripts/plan_release_tags.py final-from-rc --rc-tag "$RC_TAG")"

          if git rev-parse --verify --quiet "refs/tags/${final_tag}" >/dev/null; then
            echo "Final tag ${final_tag} already exists." >&2
            exit 1
          fi

          rc_sha="$(git rev-list -n 1 "$RC_TAG")"
          if [ -z "$rc_sha" ]; then
            echo "Could not resolve ${RC_TAG}." >&2
            exit 1
          fi

          is_prerelease="$(gh release view "$RC_TAG" --json isPrerelease --jq '.isPrerelease')"
          if [ "$is_prerelease" != "true" ]; then
            echo "${RC_TAG} must be a GitHub prerelease." >&2
            exit 1
          fi

          mkdir -p .release-evidence
          gh release download "$RC_TAG" \
            --pattern release-evidence.json \
            --dir .release-evidence \
            --clobber
          gh release download "$RC_TAG" \
            --pattern frequensolve-test-evidence.tar.gz \
            --dir .release-evidence \
            --clobber
          evidence_file=.release-evidence/release-evidence.json
          heavy_archive=.release-evidence/frequensolve-test-evidence.tar.gz
          python scripts/validate_release_evidence.py \
            "$evidence_file" \
            --commit "$rc_sha"
          expected_archive_sha="$(jq -r '.dockerTestArchiveSha256' "$evidence_file")"
          actual_archive_sha="$(sha256sum "$heavy_archive" | awk '{print $1}')"
          test "$actual_archive_sha" = "$expected_archive_sha"
          python scripts/extract_test_evidence_archive.py \
            "$heavy_archive" \
            .release-evidence/heavy
          python scripts/validate_heavy_test_evidence.py \
            .release-evidence/heavy/frequensolve-test-evidence.json \
            --commit "$rc_sha"
          ci_run_id="$(jq -r '.ciRunId' "$evidence_file")"
          python scripts/verify_ci_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$rc_sha" \
            --run-id "$ci_run_id"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$final_tag" "$rc_sha" -m "Create ${final_tag}"
          git push origin "refs/tags/${final_tag}"

          {
            echo "FrequenSolve release ${final_tag}"
            echo
            echo "- Promoted from: ${RC_TAG}"
            echo "- Source commit: ${rc_sha}"
            echo "- Package version: ${final_tag#v}"
            echo "- Required CI: $(jq -r '.ciRunUrl' "$evidence_file")"
            echo "- Solver evidence run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$(jq -r '.dockerCallerRunId' "$evidence_file")"
            echo "- Tested runtime image: $(jq -r '.dockerImageTag' "$evidence_file")"
            echo "- Publishing: PyPI via the Publish Package workflow"
            if [ -n "$NOTES" ]; then
              echo
              echo "$NOTES"
            fi
          } > release-notes.md

          gh release create "$final_tag" "$evidence_file" "$heavy_archive" \
            --target "$rc_sha" \
            --title "$final_tag" \
            --notes-file release-notes.md \
            --latest

          {
            echo "### Created release"
            echo
            echo "- Tag: \`${final_tag}\`"
            echo "- Promoted from: \`${RC_TAG}\`"
            echo "- Publish target: PyPI"
          } >> "$GITHUB_STEP_SUMMARY"
