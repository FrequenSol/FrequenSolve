name: Publish Package

permissions:
  contents: write
  actions: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag whose evidence and package should be published
        required: true
        type: string

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publication_target: ${{ steps.publication.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Derive and validate publication target
        id: publication
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_metadata="$(
            gh release view "$RELEASE_TAG" \
              --json tagName,isDraft,isPrerelease
          )"
          metadata_tag="$(jq -r '.tagName // empty' <<<"$release_metadata")"
          metadata_draft="$(jq -r '.isDraft | tostring' <<<"$release_metadata")"
          metadata_prerelease="$(
            jq -r '.isPrerelease | tostring' <<<"$release_metadata"
          )"

          test "$metadata_tag" = "$RELEASE_TAG"
          test "$metadata_draft" = false
          [[ "$metadata_prerelease" =~ ^(true|false)$ ]]

          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_sha="$(git rev-parse 'HEAD^{commit}')"
          test "$tag_sha" = "$checkout_sha"

          if [ "$EVENT_NAME" = release ]; then
            test "$EVENT_TAG" = "$metadata_tag"
            test "$EVENT_PRERELEASE" = "$metadata_prerelease"
          fi

          publication_target="$(
            python scripts/plan_release_tags.py publication-target \
              --tag "$metadata_tag" \
              --prerelease "$metadata_prerelease"
          )"
          echo "Publishing ${metadata_tag} only to ${publication_target}."
          echo "target=${publication_target}" >> "$GITHUB_OUTPUT"

      - name: Require exact-SHA CI and solver evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          mkdir -p .release-evidence
          gh release download "$RELEASE_TAG" \
            --pattern release-evidence.json \
            --dir .release-evidence \
            --clobber
          gh release download "$RELEASE_TAG" \
            --pattern frequensolve-test-evidence.tar.gz \
            --dir .release-evidence \
            --clobber
          evidence_file=.release-evidence/release-evidence.json
          heavy_archive=.release-evidence/frequensolve-test-evidence.tar.gz
          python scripts/validate_release_evidence.py \
            "$evidence_file" \
            --commit "$release_sha"
          expected_archive_sha="$(jq -r '.dockerTestArchiveSha256' "$evidence_file")"
          actual_archive_sha="$(sha256sum "$heavy_archive" | awk '{print $1}')"
          test "$actual_archive_sha" = "$expected_archive_sha"
          python scripts/extract_test_evidence_archive.py \
            "$heavy_archive" \
            .release-evidence/heavy
          python scripts/validate_heavy_test_evidence.py \
            .release-evidence/heavy/frequensolve-test-evidence.json \
            --commit "$release_sha"
          python scripts/validate_frequensolver_identity.py \
            .release-evidence/heavy/frequensolver-identity.json \
            --version "$(jq -r '.frequensolverVersion' "$evidence_file")" \
            --commit "$(jq -r '.frequensolverGitCommit' "$evidence_file")" \
            --build-id="$(jq -r '.frequensolverBuildId' "$evidence_file")"
          ci_run_id="$(jq -r '.ciRunId' "$evidence_file")"
          python scripts/verify_ci_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$release_sha" \
            --run-id "$ci_run_id"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version="$(
            python scripts/validate_release_version.py \
              --version-from-tag "$RELEASE_TAG"
          )"
          echo "Building FrequenSolve ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          build_root="$(mktemp -d)"
          build_source="${build_root}/frequensolve-${PACKAGE_VERSION}"
          mkdir -p "$build_source"
          git archive HEAD | tar -x -C "$build_source"
          python scripts/materialize_release_version.py \
            --version "$PACKAGE_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --revision "$release_sha" \
            --output "$build_source/src/frequensolve/_version.py"
          staged_version="$(
            cd "$build_source"
            python -c 'import versioneer; print(versioneer.get_version())'
          )"
          test "$staged_version" = "$PACKAGE_VERSION"
          python "$build_source/scripts/materialize_frequensolver_compatibility.py" \
            --release-evidence "$GITHUB_WORKSPACE/.release-evidence/release-evidence.json" \
            --package-release "$PACKAGE_VERSION" \
            --package-commit "$release_sha" \
            --output "$build_source/src/frequensolve/frequensolver_compatibility.json"
          test -z "$(git status --porcelain --untracked-files=no)"
          python -m build --outdir "$GITHUB_WORKSPACE/dist" "$build_source"

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install and import release wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I - <<'PY'
          import frequensolve as fs

          for name in ("Project", "LayeredModel", "LocalSite", "AWSSite"):
              if getattr(fs, name, None) is None:
                  raise SystemExit(f"missing release-wheel export: {name}")
          manifest = fs.load_frequensolver_compatibility()
          if manifest.package_release != fs.__version__:
              raise SystemExit("packaged FrequenSolver metadata version mismatch")
          if manifest.preferred_frequensolver is None:
              raise SystemExit("release wheel has no preferred FrequenSolver")
          print(fs.__version__)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.publication_target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.publication_target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          skip-existing: true

  attach-release-assets:
    name: Attach distributions to GitHub release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Attach package distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
