name: Publish Package

permissions:
  contents: write
  actions: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag whose evidence and package should be published
        required: true
        type: string
      repository:
        description: Package index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Require exact-SHA CI and solver evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          mkdir -p .release-evidence
          gh release download "$RELEASE_TAG" \
            --pattern release-evidence.json \
            --dir .release-evidence \
            --clobber
          gh release download "$RELEASE_TAG" \
            --pattern frequensolve-test-evidence.tar.gz \
            --dir .release-evidence \
            --clobber
          evidence_file=.release-evidence/release-evidence.json
          heavy_archive=.release-evidence/frequensolve-test-evidence.tar.gz
          python scripts/validate_release_evidence.py \
            "$evidence_file" \
            --commit "$release_sha"
          expected_archive_sha="$(jq -r '.dockerTestArchiveSha256' "$evidence_file")"
          actual_archive_sha="$(sha256sum "$heavy_archive" | awk '{print $1}')"
          test "$actual_archive_sha" = "$expected_archive_sha"
          python scripts/extract_test_evidence_archive.py \
            "$heavy_archive" \
            .release-evidence/heavy
          python scripts/validate_heavy_test_evidence.py \
            .release-evidence/heavy/frequensolve-test-evidence.json \
            --commit "$release_sha"
          ci_run_id="$(jq -r '.ciRunId' "$evidence_file")"
          python scripts/verify_ci_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$release_sha" \
            --run-id "$ci_run_id"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify release version
        id: version
        run: |
          version="$(python -c 'import versioneer; print(versioneer.get_version())')"
          echo "Building FrequenSolve ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          python scripts/validate_release_version.py --version "${version}"

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install and import release wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I - <<'PY'
          import frequensolve as fs

          for name in ("Project", "LayeredModel", "LocalSite", "AWSSite"):
              if getattr(fs, name, None) is None:
                  raise SystemExit(f"missing release-wheel export: {name}")
          print(fs.__version__)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: |
      (github.event_name == 'release' && github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: |
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  attach-release-assets:
    name: Attach distributions to GitHub release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Attach package distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
